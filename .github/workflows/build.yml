name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Force Download MNN Engine
        run: |
          rm -rf src/app/MNN
          git clone https://github.com/Tiggy-Chan/MNN.git src/app/MNN

      - name: Build MNN C++ Engine
        run: |
          cd src/app/MNN/project/android
          export ANDROID_NDK=$ANDROID_NDK_HOME
          chmod +x build_64.sh
          mkdir -p build_64
          cd build_64
          ../build_64.sh "-DMNN_LOW_MEMORY=true -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true -DMNN_BUILD_LLM=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DMNN_ARM82=true -DMNN_USE_LOGCAT=true -DMNN_OPENCL=true -DLLM_SUPPORT_VISION=true -DMNN_BUILD_OPENCV=true -DMNN_IMGCODECS=true"
          mkdir -p lib
          find . -type f -name "*.so" -not -path "./lib/*" -exec cp {} lib/ \;

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        working-directory: ./src
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gemma4-Web-Enabled-APK
          path: src/app/build/outputs/apk/debug/app-debug.apk
